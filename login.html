<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Login - Gestão de Projetos</title>
  <link rel="stylesheet" href="styles/style.css"> 
</head>
<body class="login-body">

  <div class="login-card">
    <h2>Área de Login</h2>
        
    <form id="meuFormularioID" action="scripts/login.php" method="POST">
      <div class="input-group">
        <label for="username">Utilizador:</label>
        <input type="text" id="username" name="username">
      </div>
            
      <div class="input-group">
        <label for="password">Palavra-passe:</label>
        <input type="password" id="password" name="password">
      </div>
            
      <p id="mensagem-erro"></p>
            
      <button type="submit" class="login-btn">Entrar</button>
    </form>
        
    <p class="login-container" style="text-align: center;">
      <a href="index.html">Voltar ao início</a>
    </p>
  </div>

  <script src="scripts/validacoes.js"></script>
</body>
</html>
