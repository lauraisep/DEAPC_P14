<!DOCTYPE html>
<html>
<head>
<style>
#all{ font-family: monospace; }
.cr { font-size : 80%;
position: fixed;
bottom: 0;
right: 0; }
@media screen and (max-width: 960px){
body {
color: rgb(240, 140, 219);
background-color: rgb(117, 193, 235);
}
header h1 { width: 100%; text-align: center; }
nav { float : left; width: 25%; height: 100px;}
#texto { width: 70%; float : left;
border: 1px white solid;
height: 100px;}
}
@media screen and (max-width: 768px){
body { color: white; background-color: rgb(117, 193, 235); }
}
@media screen and (max-width: 480px){
body { color: red; background-color: rgb(240, 140, 219); }
nav { width: 90%; height: auto; color: white; }
ul { margin-right:0; list-style-type: none; text-align: center;}
li { border: 1px gray solid; background-color:rgb(117, 193, 235) }
#texto { width: 100%; color: cyan; background-color:rgb(40,40,40)}
.cr {color: yellow}
}
</style>
</head>
<body>
<div id="all">
<header>
<h1>DEAPC !!</h1>
</header>
<nav>
<ul>
<li>Item 1</li>
<li>Item 2</li>
<li>Item 3</li>
</ul>
</nav>
<div id="texto"> Um texto qualquer ... </div>
<footer>
<div class="cr" > Copyright2026@deapc </div>
</footer>
 </div>
</body>
</html>
